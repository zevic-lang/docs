name: sync

# docs/ of zevic-lang/zevic is the source of the specification, the plan and the proposals.
# This job copies it here, so that this repository follows it: every 3 hours, and when you start it by hand.
# (zevic is public, so no token other than the one of this repository is needed.)

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zevic-lang/zevic
          path: zevic-src
          fetch-depth: 1
          sparse-checkout: docs

      - name: Copy docs/ of zevic
        run: scripts/sync-from-zevic.sh zevic-src

      - name: Commit and push when something changed
        run: |
          src_sha="$(git -C zevic-src rev-parse --short HEAD)"
          rm -rf zevic-src
          if [ -z "$(git status --porcelain)" ]; then
            echo "up to date (zevic $src_sha)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync with zevic@${src_sha}"
          git push
